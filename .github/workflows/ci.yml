name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: pnpm install --frozen-lockfile
      - run: pnpm content:check
      - run: pnpm content:snippets
      - run: pnpm content:jsonld
      - run: pnpm content:report
      - run: pnpm exec tsc --noEmit
      - run: pnpm lint
      - run: pnpm build:check
      - name: Lighthouse budgets
        run: |
          pnpm exec next start -p 4317 &
          npx --yes wait-on http://127.0.0.1:4317 --timeout 60000
          npx --yes @lhci/cli autorun --config=./lighthouserc.json
